    <!-- דפדפן שמריץ JS מקבל את תגיות ה-og מ-Helmet (כל עמוד/שיעור עם כותרת משלו); בלי זה התגיות הכלליות
         שלמעלה נשארות ראשונות ומנצחות. סורקים שלא מריצים JS ממשיכים לקבל את תגיות ברירת המחדל. -->
    <script>document.querySelectorAll('meta[property^="og:"]').forEach(function (m) { m.remove(); });</script>
